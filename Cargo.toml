[package]
name = "eprint"
version = "0.1.0"
description = "Fetch and convert IACR ePrint papers."
edition = "2021"
# oar-ocr-vl (the Markdown converter) needs 1.95.
rust-version = "1.95"
license = "Apache-2.0"
authors = ["Mark Schultz-Wu <mark@schultz-wu.com>"]
repository = "https://github.com/mark-schultz-wu/eprint"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
async-trait = "0.1"
bytes = "1"
quick-xml = "0.36"
governor = "0.6"
time = { version = "0.3", features = ["macros", "parsing", "formatting", "serde"] }

# Interactive picker for --select-version
dialoguer = "0.11"

# PDF -> Markdown: pure-Rust page rasterizer + MinerU2.5-Pro VLM (Candle).
hayro = "0.7"
image = { version = "0.25", default-features = false }
# Pinned to the commit benchmarked against eprint papers; its MinerU two-step
# page parser (`MinerU::parse_page`) isn't in a crates.io release yet (0.9.2 has it
# only as an example). TODO: switch to the crates.io release once 0.9.3 is out.
oar-ocr-vl = { git = "https://github.com/GreatV/oar-ocr", rev = "2c4ab86733bc6efe4eee988e339194f60f188f66" }
# Only to name the model's compute dtype; same version oar-ocr-vl uses, so
# Cargo unifies them.
candle-core = "0.11"
# Streaming model-weights download + integrity check.
futures-util = "0.3"
sha2 = "0.10"

# XDG paths
dirs = "5"
# Polite User-Agent + minimal HTML scraping for abstract/bibtex
regex = "1"

# Apple GPU (Metal) acceleration is always on for macOS builds.
[target.'cfg(target_os = "macos")'.dependencies]
oar-ocr-vl = { git = "https://github.com/GreatV/oar-ocr", rev = "2c4ab86733bc6efe4eee988e339194f60f188f66", features = ["metal"] }

[features]
# NVIDIA GPU acceleration for the Markdown converter (opt-in; needs a CUDA toolkit).
cuda = ["oar-ocr-vl/cuda"]

[dev-dependencies]
tempfile = "3"
# Fake eprint server for the end-to-end tests in tests/.
wiremock = "0.6"

[[bin]]
name = "eprint"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
